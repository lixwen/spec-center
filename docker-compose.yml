services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-openspec}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${OPENSPEC_MONGODB_DB:-spec-center}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-openspec_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - ./data/mongo:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-init-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "23333:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/logout-patch.js:/etc/nginx/logout-patch.js:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      OPENSPEC_MONGODB_URL: mongodb://${MONGO_APP_USERNAME:-openspec_app}:${MONGO_APP_PASSWORD}@mongo:27017/${OPENSPEC_MONGODB_DB:-openspec-center}?authSource=${OPENSPEC_MONGODB_DB:-openspec-center}
      QDRANT_URL: http://qdrant:6333
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      OPENSPEC_MONGODB_URL: mongodb://${MONGO_APP_USERNAME:-openspec_app}:${MONGO_APP_PASSWORD}@mongo:27017/${OPENSPEC_MONGODB_DB:-openspec-center}?authSource=${OPENSPEC_MONGODB_DB:-openspec-center}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
