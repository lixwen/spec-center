map $http_next_router_prefetch$http_next_router_segment_prefetch $is_prefetch {
    default  0;
    ~.+      1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location = /logout {
        if ($is_prefetch) {
            rewrite ^ /internal-prefetch-noop last;
        }
        rewrite ^ /internal-logout-action last;
    }

    location = /internal-prefetch-noop {
        internal;
        return 200 "";
    }

    location = /internal-logout-action {
        internal;
        add_header Set-Cookie "sc-auth=; Path=/; Max-Age=0; HttpOnly; SameSite=lax" always;
        add_header Set-Cookie "sc-project=; Path=/; Max-Age=0; SameSite=lax" always;
        return 302 http://$http_host/login;
    }

    location = /_nginx/logout-patch.js {
        alias /etc/nginx/logout-patch.js;
        add_header Content-Type application/javascript;
    }

    location ~ ^/api/(mcp|ask) {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;

        proxy_cookie_flags ~ nosecure;
    }

    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_cookie_flags ~ nosecure;

        sub_filter '</head>' '<script src="/_nginx/logout-patch.js"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
        proxy_set_header Accept-Encoding "";
    }
}
